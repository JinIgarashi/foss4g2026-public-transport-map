# Which operators accept the ten mutually usable transit IC cards.
#
# Seeded from the `対象事業者一覧` table of the Japanese Wikipedia article on the
# nationwide mutual-use service (see `meta.references`), then curated by hand.
# `scripts/seed_from_wikipedia.py` regenerates the seed; it never rewrites this
# file, because the curation below is the part that cannot be derived.
#
#   status: full     every line/route of this operator accepts the ten cards
#           partial  only inside certain IC areas or on certain sections
#           none     no IC ticketing
#           unknown  we could not determine it — rendered grey, never as "no"
#
#   lines:  per-line overrides keyed by the N02_003 line name, for operators
#           (all six JR companies) whose coverage is defined by area, not by
#           company. A line absent from every list keeps the operator `status`.
#
# `meta.unlisted_status` decides what an operator missing from this file means.
# The participant list is published as exhaustive and every rail operator plus
# every near-miss bus name has been reviewed against it, so `none` is the honest
# reading — see scripts/README.md for how that review is reproduced.
meta:
  source_date: '2026-04-01'
  unlisted_status:
    rail: none
    bus: none
  references:
    - https://ja.wikipedia.org/wiki/交通系ICカード全国相互利用サービス
    - https://www.jreast.co.jp/suica/area/pdf/icrule_carrier.pdf
    - https://www.jr-odekake.net/icoca/pdf/area_icoca.pdf
