# Hand-curated English names, the highest-priority source in `english.py`.
#
# Everything here overrides OpenStreetMap, Wikidata and the romaji fallback.
# Keys are the Japanese name exactly as MLIT writes it in N02 / P11 — if a name
# does not take effect, check it against the raw dataset rather than against a
# timetable, because MLIT's spelling is what the resolver sees.
#
# `data/name-en.generated.yaml` lists every line name with the English we
# resolved and where it came from. Entries still marked `source: romaji` are
# the ones worth correcting here.
#
# IC-participating operators already carry `name.en` in `ic-coverage.yaml`;
# only add an operator here when it has no entry there.

meta:
  description: Manual English names for stations, bus stops, railway lines and operators.

stations: {}

bus_stops: {}

# Reviewed against `name-en.generated.yaml`. Only lines whose automatic name was
# actually wrong are listed — a transliteration that already matches the signs
# (`Kabe Line`, `Chiba Line`) is left to the resolver so this file stays a list
# of corrections rather than a copy of the dataset.
