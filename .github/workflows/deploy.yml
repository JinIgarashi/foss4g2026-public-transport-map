name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      # `svelte-kit sync` types `$env/static/public` from the variables that are
      # actually set, so without the key here the generated module has no
      # `PUBLIC_PROTOMAP_KEY` and every import of it fails to typecheck.
      - run: pnpm check
        env:
          PUBLIC_PROTOMAP_KEY: ${{ secrets.PUBLIC_PROTOMAP_KEY }}
      - run: pnpm lint
      # The PMTiles are committed, so the tile pipeline does not run here — see
      # scripts/README.md.
      - run: pnpm build
        env:
          PUBLIC_PROTOMAP_KEY: ${{ secrets.PUBLIC_PROTOMAP_KEY }}
          BASE_PATH: /${{ github.event.repository.name }}
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
