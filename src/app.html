<!doctype html>
<html lang="%page.lang%" dir="%page.dir%">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1"
		/>
		<meta name="text-scale" content="scale" />
		<!-- Resolve the colour scheme before first paint; the site is prerendered, so
		     this cannot happen on the server. Keep in sync with `$lib/theme.svelte.ts`. -->
		<script>
			(() => {
				let stored = null;
				try {
					stored = localStorage.getItem('theme');
				} catch {
					// Blocked storage: fall back to the OS setting.
				}
				const dark =
					stored === 'dark' ||
					(stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
				document.documentElement.classList.toggle('dark', dark);
				document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
